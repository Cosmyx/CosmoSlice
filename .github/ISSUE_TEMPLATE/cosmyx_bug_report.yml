name: "[COSMYX] Bug Report"
description: Report a bug to help us improve
labels: ["bug"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: Short title for this bug
    validations:
      required: true
  - type: dropdown
    id: criticality
    attributes:
      label: Critical Point
      description: Rate the severity (0 = Non-critical, 5 = ULTRA critical)
      options:
        - "0 - Non-critical"
        - "1 - Low"
        - "2 - Medium"
        - "3 - High"
        - "4 - Very High"
        - "5 - ULTRA critical"
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Short summary of the bug
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Explanation
      description: Detailed explanation of the bug and its impact
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to Reproduce
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true