name: Resolve CosmoSlice Artifact Name

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
    outputs:
      build_tag:
        description: "<COSMOSLICE_VERSION>_<short commit hash>, e.g. 2.3.1-5_aa9dac8 (tools/version/cosmoslice_version.py)"
        value: ${{ jobs.resolve.outputs.build_tag }}
      artifact_name:
        description: "Full artifact name: CosmoSlice_<OS>_<build tag>"
        value: ${{ jobs.resolve.outputs.artifact_name }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.read_version.outputs.build_tag }}
      artifact_name: ${{ steps.read_version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the version tag
        id: read_version
        shell: bash
        run: |
          build_tag=$(python3 tools/version/cosmoslice_version.py build-tag)

          case "${{ inputs.os }}" in
            windows-2022|windows-latest) os_label="Windows" ;;
            macos-15)       os_label="Mac" ;;
            ubuntu-24.04)   os_label="Linux_Ubuntu2404" ;;
            ubuntu-20.04)   os_label="Linux_Ubuntu2004" ;;
            *)              os_label="${{ inputs.os }}" ;;
          esac

          echo "build_tag=$build_tag" >> "$GITHUB_OUTPUT"
          echo "artifact_name=CosmoSlice_${os_label}_${build_tag}" >> "$GITHUB_OUTPUT"
