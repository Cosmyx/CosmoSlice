name: Resolve CosmoSlice Artifact Name

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
    outputs:
      patch_version:
        description: "COSMYX_PATCH_VERSION read from version.inc"
        value: ${{ jobs.resolve.outputs.patch_version }}
      artifact_name:
        description: "Full artifact name: CosmoSlice_<OS>_<COSMYX_PATCH_VERSION>"
        value: ${{ jobs.resolve.outputs.artifact_name }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      patch_version: ${{ steps.read_version.outputs.patch_version }}
      artifact_name: ${{ steps.read_version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read COSMYX_PATCH_VERSION
        id: read_version
        shell: bash
        run: |
          patch_version=$(grep 'set(COSMYX_PATCH_VERSION' version.inc | cut -d '"' -f2)

          case "${{ inputs.os }}" in
            windows-latest) os_label="Windows" ;;
            macos-14)       os_label="Mac" ;;
            ubuntu-24.04)   os_label="Linux_Ubuntu2404" ;;
            ubuntu-20.04)   os_label="Linux_Ubuntu2004" ;;
            *)              os_label="${{ inputs.os }}" ;;
          esac

          echo "patch_version=$patch_version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=CosmoSlice_${os_label}_${patch_version}" >> "$GITHUB_OUTPUT"