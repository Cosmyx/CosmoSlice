<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CosmoLink Test</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 1.4em; }
        h2 { font-size: 1em; margin-top: 2em; color: #555; }
        .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        label { display: block; font-size: 0.85em; color: #333; margin-bottom: 2px; margin-top: 10px; }
        input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9em; }
        button { margin-top: 14px; padding: 8px 18px; background: #00897b; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
        button:hover { background: #00796b; }
        code { display: block; margin-top: 10px; font-size: 0.8em; color: #555; word-break: break-all; background: #f5f5f5; padding: 6px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>CosmoLink Test Page</h1>
    <p>Use the forms below to trigger <code>cosmoslice://</code> deep-link URLs and verify handling in CosmoSlice.</p>

    <!-- add-printer -->
    <div class="card">
        <h2>add-printer</h2>

        <label>Printer Name</label>
        <input id="name"   value="My OctoPrint">

        <label>Host URL</label>
        <input id="host"   value="http://octopi.local">

        <label>API Key</label>
        <input id="api"    value="ABC123">

        <label>Device UI (optional)</label>
        <input id="webui"  value="">

        <button onclick="fireAddPrinter()">Open in CosmoSlice</button>
        <code id="add-printer-url"></code>
    </div>

    <script>
        function enc(v) { return encodeURIComponent(v); }

        function buildAddPrinterUrl() {
            const name  = document.getElementById('name').value;
            const host  = document.getElementById('host').value;
            const api   = document.getElementById('api').value;
            const webui = document.getElementById('webui').value;

            let url = `cosmoslice://add-printer?name=${enc(name)}&host=${enc(host)}&api=${enc(api)}`;
            if (webui) url += `&webui=${enc(webui)}`;
            return url;
        }

        function fireAddPrinter() {
            const url = buildAddPrinterUrl();
            document.getElementById('add-printer-url').textContent = url;
            window.location.href = url;
        }

        // Keep the URL preview in sync as the user types
        ['name','host','api','webui'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                const el = document.getElementById('add-printer-url');
                if (el.textContent) el.textContent = buildAddPrinterUrl();
            });
        });
    </script>
</body>
</html>
